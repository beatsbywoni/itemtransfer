[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "itemtransfer"
version = "0.2.0"
description = "Leave-one-family-out transfer validation of item-level difficulty measures for binary item responses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["item difficulty", "transfer", "validation", "calibration", "bootstrap", "psychometrics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["itemtransfer"]

[tool.setuptools.package-data]
itemtransfer = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/beatsbywoni/itemtransfer"
